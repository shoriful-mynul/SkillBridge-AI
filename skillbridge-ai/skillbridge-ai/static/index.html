<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillBridge AI</title>
  <meta name="description" content="Prove what your CV claims: a task built from your own project, scored with quoted evidence.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E3B2A'/%3E%3Crect x='7' y='17' width='18' height='6' rx='2' fill='%23DDF08F'/%3E%3Crect x='7' y='9' width='12' height='4' rx='2' fill='%23F5F8F3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css?v=1.2.0">
</head>
<body>
  <div id="banner" role="status" aria-live="polite"></div>
  <header class="topbar">
    <div class="brand">
      <span class="wordmark">SkillBridge AI</span>
      <span class="tagline">Team Gradient · AICON’26 · EdTech &amp; Workforce</span>
    </div>
    <div class="top-actions">
      <span id="status-chip" class="chip">Checking setup…</span>
      <button type="button" class="btn ghost" id="btn-check">Check connection</button>
      <label class="btn ghost file-btn">Open saved session<input type="file" id="file-session" accept="application/json,.json" hidden></label>
    </div>
  </header>
  <div class="layout">
    <nav class="rail" aria-label="Assessment steps"><span class="eyebrow">YOUR PRACTICE JOURNEY</span><ol id="steps"></ol><p class="small">Focused practice on your own work.</p></nav>
    <main id="main" tabindex="-1"></main><aside id="focus" class="focus-card" aria-label="Practice context"></aside>
  </div>
  <footer>Student owns the feedback · Practice on one grounded task · Not a skill certification</footer><noscript><p class="panel">SkillBridge AI needs JavaScript enabled.</p></noscript>
  <script src="/static/app.js?v=1.2.0"></script>
</body>
</html>
